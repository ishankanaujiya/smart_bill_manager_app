org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Kotlin incremental compilation to avoid cross-drive path resolution
# errors on Windows (project on D:\ vs Pub cache on C:\).
kotlin.incremental=false

# Reduce memory pressure: keep the daemon small and cache build configs.
org.gradle.daemon=true
org.gradle.caching=true
