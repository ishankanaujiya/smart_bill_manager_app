name: smart_bill_manager
description: "Group Expense Management and Bill-Splitting Application"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  firebase_app_check: ^0.4.6
  cloud_functions: ^6.3.6

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database
  drift: ^2.23.1
  drift_flutter: ^0.2.4

  # Serialization
  json_annotation: ^4.9.0

  # Security
  flutter_secure_storage: ^9.2.4

  # Monitoring
  sentry_flutter: ^9.26.0

  # Networking (Cloudinary uploads)
  http: ^1.2.2

  # UI
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  country_picker: ^2.0.28
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.0
  onesignal_flutter: ^5.6.8
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/tabora_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#14B8A6"
  adaptive_icon_foreground: "assets/images/tabora_logo.png"
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-Black.ttf
          weight: 900